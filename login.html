<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChainTrace | Officer Authentication</title>
  <!-- Tailwind via CDN for zero-build rapid styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animated Cyber Grid Background */
    body {
      background-color: #020617; /* Slate 950 */
      background-image: 
        linear-gradient(rgba(15, 23, 42, 0.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.8) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: panGrid 20s linear infinite;
      overflow: hidden;
    }

    @keyframes panGrid {
      0% { background-position: 0 0; }
      100% { background-position: 30px 30px; }
    }

    /* Moving Glowing Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 10s infinite alternate ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(56, 189, 248, 0.15); top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: rgba(59, 130, 246, 0.15); bottom: -10%; right: -10%; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.05);
    }

    /* Input Focus Glow */
    .cyber-input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center font-sans text-slate-300 relative">

  <!-- Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Login Container -->
  <div class="glass-card w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
    <!-- Subtle top glow line -->
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-sky-400 to-transparent opacity-70"></div>

    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-slate-900 border border-slate-700 mb-4 shadow-[0_0_15px_rgba(56,189,248,0.2)]">
        <!-- SVG Shield / Blockchain Icon -->
        <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wider">ChainTrace</h1>
      <p class="text-xs text-sky-400 tracking-[0.2em] uppercase mt-1">Law Enforcement Portal</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Officer Badge ID</label>
        <div class="relative">
          <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input type="text" id="officerId" value="CP-FCI-042" placeholder="CP-FCI-042" class="cyber-input w-full bg-slate-900/80 border border-slate-700 text-white rounded-lg py-3 pl-10 pr-4 transition-all duration-300" required autocomplete="username">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Security PIN</label>
        <div class="relative">
          <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input type="password" id="pin" value="demo123" placeholder="••••••••" class="cyber-input w-full bg-slate-900/80 border border-slate-700 text-white rounded-lg py-3 pl-10 pr-4 transition-all duration-300" required autocomplete="current-password">
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-2 space-y-3">
        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 px-4 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(56,189,248,0.4)] hover:shadow-[0_0_25px_rgba(56,189,248,0.6)]">
          Authorize Access
        </button>
        
        <button type="button" onclick="instantBiometricLogin()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 font-medium py-3 px-4 rounded-lg transition-all duration-300">
          <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
          </svg>
          ♢ Biometric Authentication
        </button>
      </div>

      <div class="text-[11px] text-slate-500 text-center leading-relaxed pt-2">
        🔒 Authorized Personnel Only &bull; Session Encrypted &bull; Audit Logging Active
      </div>
    </form>
  </div>

  <script>
    const API_BASE = window.location.origin;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const officerId = document.getElementById('officerId').value.trim();
      const pin = document.getElementById('pin').value.trim();
      
      btn.innerHTML = `<span class="animate-pulse">Authenticating...</span>`;
      btn.disabled = true;
      
      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ officer_id: officerId, password: pin || 'demo123' })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.data?.token) {
            localStorage.setItem('cs_token', data.data.token);
            localStorage.setItem('cs_officer_id', data.data.officer.officer_id);
          }
        }
      } catch (err) {
        console.warn('[ChainTrace] Login request fallback:', err.message);
      }
      
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 900);
    });

    async function instantBiometricLogin() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ officer_id: 'CP-FCI-042', password: 'demo' })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.data?.token) {
            localStorage.setItem('cs_token', data.data.token);
            localStorage.setItem('cs_officer_id', 'CP-FCI-042');
          }
        }
      } catch (err) {}
      window.location.href = 'index.html'; 
    }
  </script>
</body>
</html>
